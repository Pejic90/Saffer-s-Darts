<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1d4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saffer's Liga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Saffer's Liga</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --bg1:#08102a; --bg2:#0b1d4a; --card:#111b3a; --card2:#0d1631; --line:#1f3570;
    --blue:#2f6bff; --blue2:#1f4fd1; --text:#fff; --dim:#a9b7d9; --muted:#6f80ab;
    --green:#22c55e; --red:#ef4466; --gold:#f5c542; --live:#ff3b5c;
    --head:'Oswald','Arial Narrow',Impact,sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg1); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; }
  body { min-height: 100vh; background: radial-gradient(900px 500px at 15% -5%, #14378a 0%, transparent 60%), linear-gradient(170deg, var(--bg2), var(--bg1) 55%); background-attachment: fixed; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(8,16,42,.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
  .top-in { max-width: 760px; margin: 0 auto; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); }
  .back { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; line-height: 1; background: var(--card); border: 1px solid var(--line); padding-bottom: 3px; }
  .top-title { flex: 1; min-width: 0; font-family: var(--head); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Type */
  h2.sec { margin: 8px 0 0; display: flex; align-items: center; gap: 10px; font-family: var(--head); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  h2.sec::before { content: ""; width: 4px; height: 20px; background: var(--blue); border-radius: 2px; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
  .msg { padding: 10px 14px; border-radius: 12px; background: rgba(47,107,255,.12); border: 1px solid rgba(47,107,255,.4); color: #dbe6ff; font-size: 13px; }
  .msg.err { background: rgba(239,68,102,.12); border-color: rgba(239,68,102,.45); color: #ffc2cf; }

  /* Cards */
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  a.card:active { border-color: var(--blue); }
  .grid { display: grid; gap: 12px; }
  .ava { border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; background: var(--card2); }
  .ava.ini { background: var(--blue2); color: #fff; font-weight: 800; }
  .tag { display: inline-block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); color: var(--dim); }
  .tag.t-league { color: #8fb0ff; } .tag.t-tour { color: #c4a6ff; } .tag.t-live { color: var(--green); border-color: rgba(34,197,94,.45); }

  /* Live */
  .livechip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #fff; background: var(--live); border-radius: 999px; padding: 3px 10px 3px 8px; }
  .livechip i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .livecard { border-color: rgba(255,59,92,.55); background: linear-gradient(180deg, rgba(255,59,92,.10), var(--card) 60%); }
  .lc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lc-comp { flex: 1; min-width: 0; color: var(--dim); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lc-leg { color: var(--muted); font-size: 12px; }
  .lc-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: #050b1f; margin-top: 6px; border: 1px solid transparent; }
  .lc-row.on { border-color: var(--blue); }
  .lc-name { flex: 1; min-width: 0; font-family: var(--head); font-size: 18px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lc-rem { font-family: var(--head); font-size: 22px; font-weight: 700; color: var(--dim); min-width: 44px; text-align: right; }
  .lc-legs { min-width: 26px; height: 26px; border-radius: 8px; background: var(--blue); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }

  /* Competition cards */
  .cc-top { display: flex; gap: 6px; align-items: center; }
  .cc-name { font-family: var(--head); font-size: 24px; font-weight: 700; text-transform: uppercase; margin: 8px 0 2px; }
  .cc-meta { color: var(--muted); font-size: 12px; }
  .cc-line { margin-top: 8px; color: var(--dim); font-size: 13px; }
  .cc-line b { color: var(--text); }
  .cc-win { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--gold); font-weight: 700; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; overflow-x: auto; }
  .tabs a { flex: 1; text-align: center; white-space: nowrap; padding: 10px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--dim); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .tabs a.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* Table */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: center; padding: 10px 4px; font-family: var(--head); font-size: 14px; font-weight: 600; color: var(--dim); text-transform: uppercase; background: var(--card2); }
  .tbl th:first-child { border-radius: 10px 0 0 10px; } .tbl th:last-child { border-radius: 0 10px 10px 0; }
  .tbl td { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: center; font-size: 14px; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl td.pl { text-align: left; padding-left: 6px; }
  .tbl .pos { width: 30px; color: var(--dim); }
  .tbl .pts { color: var(--blue); font-weight: 800; font-size: 16px; }
  .tp { display: flex; align-items: center; gap: 8px; font-weight: 800; text-transform: uppercase; font-size: 13px; min-width: 0; }
  .tp span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbl tr.top3 .pos { color: var(--gold); font-weight: 800; }

  /* Match rows */
  .mrow { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .mrow.live { border-color: rgba(255,59,92,.55); }
  .mr-line { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .mr-name { flex: 1; min-width: 0; font-family: var(--head); font-size: 18px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mr-legs { font-family: var(--head); font-size: 22px; font-weight: 700; color: var(--dim); min-width: 22px; text-align: right; }
  .mr-win .mr-name, .mr-win .mr-legs { color: var(--green); }
  .mr-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .mr-bye { color: var(--muted); font-style: italic; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .sub { color: var(--dim); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin: 6px 2px 0; }

  /* Winner / honors */
  .winner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: linear-gradient(90deg, rgba(245,197,66,.18), rgba(47,107,255,.10)); border: 1px solid rgba(245,197,66,.45); }
  .winner small { display: block; font-size: 11px; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
  .winner b { font-family: var(--head); font-size: 26px; text-transform: uppercase; }
  .honors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .honor { text-align: center; padding: 14px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .honor small { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .honor .nm { font-weight: 800; text-transform: uppercase; font-size: 13px; }
  .honor .val { font-family: var(--head); font-size: 26px; font-weight: 700; color: var(--blue); }

  /* KO */
  .round-title { font-family: var(--head); font-size: 17px; font-weight: 700; text-transform: uppercase; color: var(--dim); margin: 6px 2px 0; }

  /* Ticker */
  .tk-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tk-sub { color: var(--dim); font-size: 13px; text-align: center; }
  .tk-board { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pl { text-align: center; padding: 14px 8px 12px; border-radius: 20px; background: var(--card); border: 2px solid var(--line); position: relative; }
  .pl.on { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(47,107,255,.18); }
  .pl .ava { margin: 0 auto 6px; display: flex; }
  .pl-name { font-family: var(--head); font-size: 20px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-turn { height: 16px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: var(--blue); text-transform: uppercase; }
  .pl-rem { font-family: var(--head); font-size: 64px; font-weight: 700; line-height: 1; }
  .pl-legs { position: absolute; top: 10px; right: 10px; min-width: 30px; height: 30px; border-radius: 9px; background: var(--blue); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  .pl-stats { margin-top: 8px; color: var(--muted); font-size: 12px; display: flex; justify-content: center; gap: 10px; }
  .pl-stats b { color: var(--dim); }
  .darts { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 46px; flex-wrap: wrap; }
  .dart { min-width: 54px; padding: 9px 10px; text-align: center; border-radius: 12px; background: #050b1f; border: 1px solid var(--line); font-family: var(--head); font-size: 20px; font-weight: 700; }
  .dart.T { border-color: var(--blue); color: #9db9ff; } .dart.D { border-color: var(--green); color: #7ee2a3; } .dart.M { color: var(--muted); }
  .dart-sum { font-family: var(--head); font-size: 24px; color: var(--dim); margin-left: 6px; }
  .rt { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rt span { padding: 7px 10px; border-radius: 10px; background: #050b1f; font-family: var(--head); font-size: 18px; font-weight: 600; color: var(--dim); }
  .rt span.l { text-align: left; } .rt span.r { text-align: right; } .rt span.empty { background: transparent; }
  .rt span.big { color: #9db9ff; } .rt span.max { color: var(--gold); }
  .final { text-align: center; padding: 14px; border-radius: 16px; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.45); }
  .final b { font-family: var(--head); font-size: 24px; }
  .btn { display: inline-block; padding: 11px 18px; border-radius: 12px; background: var(--blue); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
  .center { text-align: center; }
</style>
</head>

    Promise.all(["leagues", "matches", "players", "koPhase"].map((n) => db.collection(n).get())).then((r) => {
      S.old.leagues = docs(r[0]); S.old.matches = docs(r[1]);
      S.old.players = {}; docs(r[2]).forEach((p) => { S.old.players[p.id] = p; });
      S.old.ko = {}; docs(r[3]).forEach((k) => { S.old.ko[k.id] = k; });
      S.old.loaded = true; scheduleRender();
    }).catch((e) => { S.old.error = e.message; S.old.loaded = true; scheduleRender(); });
  }

  // ---------------------------------------------------------------------------
  // Logic
  // ---------------------------------------------------------------------------
  const isLive = (d) => !!d && d.status === "laufend" && Date.now() - (Number(d.updatedMs) || 0) < LIVE_FRESH_MS;
  const liveList = () => Object.values(S.live).filter(isLive).sort((a, b) => (Number(b.startedMs) || 0) - (Number(a.startedMs) || 0));
  const liveFor = (m) => (m && m.autodartsMatchId && isLive(S.live[m.autodartsMatchId]) ? S.live[m.autodartsMatchId] : null);

  const koLabel = (i, total) => { const f = total - 1 - i; return f === 0 ? "Finale" : f === 1 ? "Halbfinale" : f === 2 ? "Viertelfinale" : f === 3 ? "Achtelfinale" : "Runde " + (i + 1); };

  // 2 points per win, then leg difference, then average, then name.
  function standings(ids, matches) {
    const st = {};
    ids.forEach((id) => { st[id] = { id, played: 0, wins: 0, losses: 0, legsFor: 0, legsAgainst: 0, points: 0, avgSum: 0, avgCount: 0 }; });
    matches.forEach((m) => {
      if (m.status !== "beendet" || m.bye) return;
      const a = st[m.playerAId], b = st[m.playerBId];
      if (!a || !b) return;
      const la = Number(m.legsA) || 0, lb = Number(m.legsB) || 0;
      a.played++; b.played++;
      a.legsFor += la; a.legsAgainst += lb; b.legsFor += lb; b.legsAgainst += la;
      if (la > lb) { a.wins++; a.points += 2; b.losses++; } else if (lb > la) { b.wins++; b.points += 2; a.losses++; }
      [[a, m.avgA], [b, m.avgB]].forEach(([s, avg]) => { if (avg != null && avg !== "" && !isNaN(avg)) { s.avgSum += Number(avg); s.avgCount++; } });
    });
    return Object.values(st).map((s) => Object.assign(s, { avg: s.avgCount ? s.avgSum / s.avgCount : null }))
      .sort((x, y) => y.points - x.points || (y.legsFor - y.legsAgainst) - (x.legsFor - x.legsAgainst) || (y.avg || 0) - (x.avg || 0) || String(P(x.id).name).localeCompare(String(P(y.id).name)));
  }

  // Highest single checkout, and the best MEAN of a player's match averages.
  function honors(matches) {
    let co = null; const acc = {};
    matches.forEach((m) => {
      if (m.status !== "beendet" || m.bye) return;
      [[m.playerAId, m.avgA, m.checkoutA], [m.playerBId, m.avgB, m.checkoutB]].forEach(([id, avg, c]) => {
        if (!id) return;
        if (c != null && c !== "" && !isNaN(c) && Number(c) > 0 && (!co || Number(c) > co.value)) co = { id, value: Number(c) };
        if (avg != null && avg !== "" && !isNaN(avg)) { (acc[id] = acc[id] || { sum: 0, n: 0 }); acc[id].sum += Number(avg); acc[id].n++; }
      });
    });
    let av = null;
    Object.keys(acc).forEach((id) => { const mean = acc[id].sum / acc[id].n; if (!av || mean > av.value) av = { id, value: mean }; });
    return { co, avg: av };
  }

  // Models: one shape for new competitions and for the old app's leagues.
  function modelAdl(c) {
    const ms = S.matches.filter((m) => m.competitionId === c.id);
    const total = c.koRounds || 0, ko = ms.filter((m) => m.stage === "ko"), rounds = [];
    for (let r = 0; r < total; r++) rounds.push({ label: koLabel(r, total), matches: ko.filter((m) => m.koRound === r).sort((a, b) => (a.slot || 0) - (b.slot || 0)) });
    return {
      src: "adl", prefix: "#/c/", id: c.id, name: c.name, type: c.type, finished: c.status === "beendet", phase: c.phase,
      winnerId: c.winnerId || null, winnerName: null, ts: tms(c.createdAt), ids: c.playerIds || [], bestOf: c.bestOf,
      league: ms.filter((m) => m.stage === "league").sort((a, b) => (a.order || 0) - (b.order || 0)), rounds,
    };
  }

  function bootstrapLeagueId() {
    if (!S.old.leagues.length) return null;
    return S.old.leagues.slice().sort((a, b) => tms(a.createdAt) - tms(b.createdAt))[0].id;
  }

  function modelOld(l) {
    const boot = bootstrapLeagueId();
    const ms = S.old.matches.filter((m) => (m.leagueId || boot) === l.id)
      .sort((a, b) => String(a.round || "").localeCompare(String(b.round || "")) || tms(a.createdAt) - tms(b.createdAt));
    let ids = Array.isArray(l.participantIds) && l.participantIds.length ? l.participantIds.filter((id) => S.old.players[id]) : [];
    if (!ids.length) { const set = {}; ms.forEach((m) => { set[m.playerAId] = 1; set[m.playerBId] = 1; }); ids = Object.keys(set).filter((id) => S.old.players[id]); }
    const ko = S.old.ko[l.id];
    const rounds = ko && Array.isArray(ko.rounds) ? ko.rounds.map((r) => ({ label: r.name, matches: r.matches || [] })) : [];
    const winnerId = l.winnerId || (ko && ko.winnerId) || null;
    return {
      src: "old", prefix: "#/o/", id: l.id, name: l.name, type: "league", finished: l.status === "archiviert" || !!winnerId, phase: null,
      winnerId, winnerName: l.winnerName || null, ts: tms(l.archivedAt) || tms(l.createdAt), ids, bestOf: null, league: ms, rounds,
    };
  }

  // ---------------------------------------------------------------------------
  // Components
  // ---------------------------------------------------------------------------
  function avatar(id, size) {
    const p = P(id), s = size || 36;
    if (p.photo) return `<img class="ava" style="width:${s}px;height:${s}px" src="${esc(p.photo)}" alt="">`;
    return `<span class="ava ini" style="width:${s}px;height:${s}px;font-size:${Math.round(s * 0.38)}px">${esc(String(p.name).slice(0, 2).toUpperCase())}</span>`;
  }

  function topbar(back, title, right) {
    return `<header class="top"><div class="top-in">
      ${back ? `<a class="back" href="${esc(back)}">‹</a>` : `<img class="logo" src="${LOGO}" alt="">`}
      <div class="top-title">${esc(title || "Saffer's Liga")}</div>${right || ""}
    </div></header>`;
  }
  const shell = (top, body) => top + `<main class="wrap">${S.error ? `<div class="msg err">${esc(S.error)}</div>` : ""}${body}</main>`;
  const loading = () => `<div class="empty">Lade Daten…</div>`;
  const dataReady = () => S.ready.players && S.ready.comps && S.ready.matches;

  function matchRow(m) {
    const bye = m.bye || !m.playerBId;
    const done = m.status === "beendet";
    const lv = liveFor(m);
    if (bye) {
      return `<div class="mrow"><div class="mr-line mr-win">${m.playerAId ? avatar(m.playerAId, 30) : ""}<span class="mr-name">${m.playerAId ? esc(P(m.playerAId).name) : "—"}</span></div><div class="mr-meta"><span class="mr-bye">Freilos</span></div></div>`;
    }
    const line = (id, legs, win) => `<div class="mr-line${win ? " mr-win" : ""}">${id ? avatar(id, 30) : `<span class="ava" style="width:30px;height:30px"></span>`}<span class="mr-name">${id ? esc(P(id).name) : "—"}</span>${lv ? `<span class="mr-legs">${esc(lv.players[id === m.playerAId ? 0 : 1].legs)}</span>` : done ? `<span class="mr-legs">${esc(legs)}</span>` : ""}</div>`;
    const aWin = done && Number(m.legsA) > Number(m.legsB), bWin = done && Number(m.legsB) > Number(m.legsA);
    const meta = [];
    if (m.round) meta.push(esc(m.round));
    if (m.bestOf) meta.push("Best of " + esc(m.bestOf));
    let right = "";
    if (lv) right = `<span class="livechip"><i></i>LIVE</span>`;
    else if (done && (m.avgA != null || m.avgB != null)) right = `Ø ${fmt2(m.avgA)} · ${fmt2(m.avgB)}${m.checkoutA || m.checkoutB ? ` · CO ${m.checkoutA || "–"}/${m.checkoutB || "–"}` : ""}`;
    const inner = `${line(m.playerAId, m.legsA, aWin)}${line(m.playerBId, m.legsB, bWin)}<div class="mr-meta"><span>${meta.join(" · ")}</span><span>${right}</span></div>`;
    return lv ? `<a class="mrow live" href="#/live/${esc(m.autodartsMatchId)}">${inner}</a>` : `<div class="mrow">${inner}</div>`;
  }

  function tableHtml(ids, matches) {
    const rows = standings(ids, matches);
    if (!rows.length) return `<div class="empty">Noch keine Spieler.</div>`;
    return `<div class="card" style="padding:6px 10px"><table class="tbl"><thead><tr><th>#</th><th style="text-align:left;padding-left:6px">Spieler</th><th>Sp</th><th>S</th><th>Legs</th><th>Ø</th><th>Pkt</th></tr></thead><tbody>
      ${rows.map((s, i) => `<tr class="${i < 3 ? "top3" : ""}"><td class="pos">${i + 1}</td><td class="pl"><div class="tp">${avatar(s.id, 28)}<span>${esc(P(s.id).name)}</span></div></td><td>${s.played}</td><td>${s.wins}</td><td>${s.legsFor}:${s.legsAgainst}</td><td>${s.avg == null ? "–" : s.avg.toFixed(1)}</td><td class="pts">${s.points}</td></tr>`).join("")}
    </tbody></table></div>`;
  }

  function honorsHtml(matches, finished) {
    const h = honors(matches);
    if (!h.co && !h.avg) return "";
    const box = (label, x, val) => `<div class="honor"><small>${label}</small>${avatar(x.id, 54)}<span class="nm">${esc(P(x.id).name)}</span><span class="val">${val}</span></div>`;
    return `<h2 class="sec">${finished ? "Ehrungen" : "Bestwerte bisher"}</h2><div class="honors">
      ${h.co ? box("Höchster Checkout", h.co, h.co.value) : "<span></span>"}
      ${h.avg ? box("Bester Ø-Average", h.avg, h.avg.value.toFixed(2)) : "<span></span>"}
    </div>`;
  }

  // ---------------------------------------------------------------------------
  // Views
  // ---------------------------------------------------------------------------
  function liveCard(d) {
    const pl = d.players || [];
    return `<a class="card livecard" href="#/live/${esc(d.id)}">
      <div class="lc-top"><span class="livechip"><i></i>LIVE</span><span class="lc-comp">${esc(d.competitionName || "")}</span><span class="lc-leg">Leg ${esc(d.leg)}</span></div>
      ${pl.map((p) => `<div class="lc-row${p.thrower ? " on" : ""}">${avatar(p.id, 34)}<span class="lc-name">${esc(p.name)}</span><span class="lc-rem">${esc(p.remaining)}</span><span class="lc-legs">${esc(p.legs)}</span></div>`).join("")}
    </a>`;
  }

  function koRoundNow(M) {
    for (let i = 0; i < M.rounds.length; i++) if (M.rounds[i].matches.some((m) => m.status !== "beendet")) return M.rounds[i].label;
    return null;
  }

  function compCard(M) {
    const tag = M.src === "old" ? "Archiv" : M.type === "league" ? "Liga" : "Turnier";
    let line = "", meta = [];
    if (M.type === "league" && M.league.length) {
      const played = M.league.filter((m) => m.status === "beendet").length;
      meta.push(`${played}/${M.league.length} Spiele`);
      if (!M.finished && M.phase !== "ko") {
        const top = standings(M.ids, M.league).slice(0, 3);
        line = top.map((s, i) => `${i + 1}. ${esc(P(s.id).name)} <b>${s.points}</b>`).join(" · ");
      }
    }
    if (!M.finished && M.rounds.length) { const r = koRoundNow(M); if (r) { meta.push(r); line = line && M.phase !== "ko" ? line : "KO-Phase läuft"; } }
    const winner = M.winnerId ? `<div class="cc-win">${avatar(M.winnerId, 28)}<span>🏆 ${esc(P(M.winnerId).name)}</span></div>` : M.winnerName ? `<div class="cc-win"><span>🏆 ${esc(M.winnerName)}</span></div>` : "";
    return `<a class="card" href="${M.prefix}${esc(M.id)}">
      <div class="cc-top"><span class="tag ${M.type === "league" ? "t-league" : "t-tour"}">${tag}</span>${M.finished ? "" : `<span class="tag t-live">Läuft</span>`}</div>
      <div class="cc-name">${esc(M.name)}</div>
      <div class="cc-meta">${[fmtDate(M.ts), M.ids.length + " Spieler"].concat(meta).filter(Boolean).join(" · ")}</div>
      ${line ? `<div class="cc-line">${line}</div>` : ""}${winner}
    </a>`;
  }

  function viewHome() {
    const lives = liveList();
    const adl = Object.values(S.comps).map(modelAdl).sort((a, b) => b.ts - a.ts);
    const running = adl.filter((M) => !M.finished);
    const past = adl.filter((M) => M.finished).concat(S.old.leagues.map(modelOld)).sort((a, b) => b.ts - a.ts);
    let body = "";
    if (lives.length) body += `<h2 class="sec">Live</h2><div class="grid">${lives.map(liveCard).join("")}</div>`;
    body += `<h2 class="sec">Aktuell</h2>`;
    body += !dataReady() ? loading() : running.length ? `<div class="grid">${running.map(compCard).join("")}</div>` : `<div class="empty">Gerade läuft keine Liga und kein Turnier.</div>`;
    body += `<h2 class="sec">Vergangene Ligen & Turniere</h2>`;
    body += !dataReady() || !S.old.loaded ? loading() : past.length ? `<div class="grid">${past.map(compCard).join("")}</div>` : `<div class="empty">Noch keine.</div>`;
    return shell(topbar(null, "Saffer's Liga"), body);
  }

  function viewModel(M, r) {
    const hasKo = M.rounds.length > 0, hasLeague = M.type === "league" && M.league.length > 0;
    const tabs = [];
    if (hasLeague) tabs.push(["table", "Tabelle"], ["schedule", "Spielplan"]);
    if (hasKo) tabs.push(["ko", M.type === "league" ? "KO-Phase" : "Turnierbaum"]);
    let tab = r.tab;
    if (!tabs.some((t) => t[0] === tab)) tab = (M.type === "tournament" || M.phase === "ko") && hasKo ? "ko" : (tabs[0] ? tabs[0][0] : "table");

    let body = "";
    if (M.winnerId) body += `<div class="winner">${avatar(M.winnerId, 64)}<div><small>Sieger</small><b>🏆 ${esc(P(M.winnerId).name)}</b></div></div>`;
    else if (M.winnerName) body += `<div class="winner"><div><small>Sieger</small><b>🏆 ${esc(M.winnerName)}</b></div></div>`;
    if (tabs.length > 1) body += `<nav class="tabs">${tabs.map((t) => `<a class="${t[0] === tab ? "on" : ""}" href="${M.prefix}${esc(M.id)}/${t[0]}">${t[1]}</a>`).join("")}</nav>`;

    const allMatches = M.league.concat(...M.rounds.map((x) => x.matches));
    if (tab === "table" && hasLeague) {
      body += tableHtml(M.ids, M.league) + honorsHtml(allMatches, M.finished);
    } else if (tab === "schedule" && hasLeague) {
      if (M.finished) {
        const rounds = Array.from(new Set(M.league.map((m) => m.round || "")));
        rounds.forEach((rd) => { body += (rounds.length > 1 ? `<div class="sub">${esc(rd || "Spiele")}</div>` : "") + `<div class="list">${M.league.filter((m) => (m.round || "") === rd).map(matchRow).join("")}</div>`; });
      } else {
        const live = M.league.filter((m) => liveFor(m)), open = M.league.filter((m) => m.status !== "beendet" && !liveFor(m)), done = M.league.filter((m) => m.status === "beendet").reverse();
        if (live.length) body += `<div class="sub">Live</div><div class="list">${live.map(matchRow).join("")}</div>`;
        if (open.length) body += `<div class="sub">Nächste Spiele</div><div class="list">${open.map(matchRow).join("")}</div>`;
        if (done.length) body += `<div class="sub">Gespielt</div><div class="list">${done.map(matchRow).join("")}</div>`;
      }
    } else if (tab === "ko" && hasKo) {
      M.rounds.forEach((rd) => { body += `<div class="round-title">${esc(rd.label)}</div><div class="list">${rd.matches.map(matchRow).join("")}</div>`; });
      if (M.type === "tournament") body += honorsHtml(allMatches, M.finished);
    } else {
      body += `<div class="empty">Noch keine Spiele.</div>`;
    }
    return shell(topbar("#/", M.name), body);
  }

  function viewComp(r) {
    if (!dataReady()) return shell(topbar("#/", "Laden…"), loading());
    const c = S.comps[r.id];
    if (!c) return shell(topbar("#/", "Nicht gefunden"), `<div class="empty">Diese Liga gibt es nicht (mehr).</div>`);
    return viewModel(modelAdl(c), r);
  }

  function viewOld(r) {
    if (!S.old.loaded) return shell(topbar("#/", "Laden…"), loading());
    const l = S.old.leagues.find((x) => x.id === r.id);
    if (!l) return shell(topbar("#/", "Nicht gefunden"), `<div class="empty">Diese Liga gibt es nicht (mehr).</div>`);
    return viewModel(modelOld(l), r);
  }

  function dartClass(n) { return /^T/.test(n) ? "T" : /^D/.test(n) ? "D" : /^M/.test(n) ? "M" : ""; }

  function viewLive(r) {
    if (!S.ready.live) return shell(topbar("#/", "Live"), loading());
    const d = S.live[r.id];
    if (!d) return shell(topbar("#/", "Live"), `<div class="empty">Dieses Match wurde nicht gefunden.</div><div class="center"><a class="btn" href="#/">Zur Startseite</a></div>`);
    const ended = d.status !== "laufend", fresh = isLive(d);
    const pl = d.players || [];
    const back = d.competitionId && S.comps[d.competitionId] ? "#/c/" + d.competitionId : "#/";
    const chip = ended ? `<span class="tag">${d.status === "beendet" ? "Beendet" : "Abgebrochen"}</span>` : fresh ? `<span class="livechip"><i></i>LIVE</span>` : `<span class="tag">Pausiert</span>`;
    let body = `<div class="tk-sub">${esc(d.competitionName || "")} · Leg ${esc(d.leg)} · Best of ${esc(d.bestOf)}</div>`;
    body += `<div class="tk-board">${pl.map((p) => `<div class="pl${p.thrower && !ended ? " on" : ""}">
      <span class="pl-legs">${esc(p.legs)}</span>${avatar(p.id, 60)}
      <div class="pl-name">${esc(p.name)}</div>
      <div class="pl-turn">${p.thrower && !ended ? "am Wurf" : ""}</div>
      <div class="pl-rem">${esc(p.remaining)}</div>
      <div class="pl-stats"><span>Ø <b>${p.avg == null ? "–" : Number(p.avg).toFixed(1)}</b></span>${Number(p.total180) > 0 ? `<span>180er <b>${esc(p.total180)}</b></span>` : ""}</div>
    </div>`).join("")}</div>`;
    if (ended) {
      body += `<div class="final"><div class="muted">${d.status === "beendet" ? "Endstand" : "Match abgebrochen"}</div><b>${esc((pl[0] || {}).name)} ${esc((pl[0] || {}).legs)} : ${esc((pl[1] || {}).legs)} ${esc((pl[1] || {}).name)}</b></div>`;
      if (back !== "#/") body += `<div class="center"><a class="btn" href="${back}">Zur Tabelle</a></div>`;
    } else {
      const ageMin = Math.floor((Date.now() - (Number(d.updatedMs) || 0)) / 60000);
      if (!fresh) body += `<div class="msg">Seit ${ageMin} Min. keine Daten – das Match ist unterbrochen oder beendet.</div>`;
      const darts = d.darts || [];
      const thrower = pl.find((p) => p.thrower);
      body += `<h2 class="sec">${thrower ? esc(thrower.name) : "Aktuelle Aufnahme"}</h2><div class="card"><div class="darts">${darts.length ? darts.map((n) => `<span class="dart ${dartClass(n)}">${esc(n)}</span>`).join("") + `<span class="dart-sum">= ${esc(d.turnPoints)}</span>` : `<span class="muted">wirft gleich…</span>`}</div></div>`;
    }
    const recent = d.recent || [];
    if (recent.length) {
      body += `<h2 class="sec">Letzte Aufnahmen</h2><div class="rt">${recent.map((t) => {
        const cls = t.pts === 180 ? "max" : t.pts >= 100 ? "big" : "";
        return t.p === 0 ? `<span class="l ${cls}">${esc(t.pts)}</span><span class="empty"></span>` : `<span class="empty"></span><span class="r ${cls}">${esc(t.pts)}</span>`;
      }).join("")}</div>`;
    }
    return shell(topbar(back, (pl[0] ? pl[0].name : "") + " vs " + (pl[1] ? pl[1].name : ""), chip), body);
  }

  // ---------------------------------------------------------------------------
  // Router
  // ---------------------------------------------------------------------------
  function parseRoute() {
    const p = String(location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (p[0] === "live" && p[1]) return { name: "live", id: p[1] };
    if (p[0] === "c" && p[1]) return { name: "comp", id: p[1], tab: p[2] || "" };
    if (p[0] === "o" && p[1]) return { name: "old", id: p[1], tab: p[2] || "" };
    return { name: "home" };
  }

  function render() {
    const r = parseRoute();
    let html;
    try { html = ({ home: viewHome, comp: viewComp, old: viewOld, live: viewLive }[r.name])(r); }
    catch (e) { html = shell(topbar(null, "Saffer's Liga"), `<div class="msg err">Anzeigefehler: ${esc(e.message)}</div>`); if (typeof console !== "undefined") console.error(e); }
    app.innerHTML = html;
  }

  window.addEventListener("hashchange", () => { if (window.scrollTo) window.scrollTo(0, 0); render(); });
  // Re-check "stale" live matches even when no new data arrives.
  setInterval(() => { const n = parseRoute().name; if (n === "home" || n === "live") scheduleRender(); }, 30000);
  render();
})();
</script>
</body>
</html>
